
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PATH: /app/data/mylingua.db
      FRONTEND_URL: http://localhost:8081

      # Credenciais temporárias para teste
      JWT_SECRET: "TESTE_JWT_CHAVE_12345678901234567890"
      ADMIN_NAME: "Admin"
      ADMIN_EMAIL: "master@example.com"
      ADMIN_PASSWORD: "MyLingua_Admin_2026_Senha_Segura_123"

    volumes:
      - mylingua-data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api

    ports:
      - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mylingua-data:
